# DocTrack — proxying the websocket to the Reverb daemon.
#
# Paste these two blocks inside the server {} that already serves DocTrack.
# They do not start anything: without a running `reverb:start` behind them the
# proxy answers 502, which the app survives — every page works from its
# Inertia props and the header wordmark simply shows red.
#
# Two paths, because Pusher's protocol uses both: /app/{key} is the websocket
# the browser opens, /apps/{id}/... is the HTTP API the PHP side publishes
# events through.

location /app {
    proxy_pass http://127.0.0.1:8082;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The upgrade handshake. Without these two the connection is answered as
    # an ordinary request and the browser reports a failed websocket.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";

    # A websocket is idle between messages by definition; the default 60s
    # timeout closes a working connection and the client reconnects in a loop.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /apps {
    proxy_pass http://127.0.0.1:8082;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
