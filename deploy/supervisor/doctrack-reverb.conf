; DocTrack — the Reverb websocket server.
;
; One program, not four. The neoaccess config beside this one supervises a
; queue worker, an imports worker and the scheduler as well; DocTrack needs
; none of them. Nothing in app/ implements ShouldQueue — the trail events are
; ShouldBroadcastNow precisely so realtime does not depend on a worker — and
; the one scheduled command (files:purge, weekly) belongs in cron, which the
; deploy README gives a line for.
;
; Install:
;   sudo cp deploy/supervisor/doctrack-reverb.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status doctrack-reverb
;
; The port must match REVERB_SERVER_PORT in .env. It is passed on the command
; line as well so a misconfigured .env fails loudly at start rather than
; silently binding somewhere the proxy is not looking. 8082 because 8080 and
; 8081 are already taken on this machine.

[program:doctrack-reverb]
command=/usr/bin/php /home/yuri/Projects/dms/artisan reverb:start --host=127.0.0.1 --port=8082
directory=/home/yuri/Projects/dms

; `yuri`, not `www-data`, because storage/ and bootstrap/cache/ are owned by
; yuri here and Reverb writes to both. Running as www-data means chowning
; those first, or the daemon dies at boot with a permissions error that reads
; like a Reverb bug.
user=yuri

autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10

; Reverb holds open sockets; stopping the group is what actually ends them.
stopasgroup=true
killasgroup=true

redirect_stderr=true
stdout_logfile=/home/yuri/Projects/dms/storage/logs/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
